  notes: "chore: refresh qc fixes and platform deps\nMerge pull request #3 from horde/feat/adopt-nls-psr4\nrefactor: Use PSR-4 version of horde/nls\nchore: Update workflow dependency\nrefactor(injector): Widen type hints from Horde_Injector to Horde_Injector|Injector\nMerge pull request #1 from horde/feat/remove-net-smtp\nfeat: Use horde/smtp instead of pear/net_smtp\nUpdate metadata and workflows for PHP 8 support\nAdd CI job for satis repo update\nAdd warning against using this master branch for patches\nRegenerate composer.json\nUpdate supported PHP versions and configuration names.\nStandardize descriptions.\nAdd chomp character.\nEnable PHP 7.3 CI.\nUpdate package definitions.\nFix getting exit code on PHP 7.2+.\nMark Chuck and Michael as inactive.\nFix name/description.\nCreate CHANGES for all components.\nRegenerate package.xml from changelog.yml.\nBuild changelog.yml from existing changelog(s).\nUpdate .horde.yml with extended information.\nUpdate composer.json.\nEnable 7.2 builds.\nPEAR on 5.6 and 7.0 is fixed.\nUpdate file list\nMove phpunit configuration to base directory.\nIndicate markup language.\nUpdate references to COPYING files.\nUse LICENSE consistently and move to base directory.\nStop flooding #horde channel.\nUse https URLs.\nRemove incorrect links.\nInstall all dependencies but PECL extensions.\nHopefully this finally fixes Travis builds now.\nAlways discover channel manually, due to Travis bug.\nFix Travis tests.\nAdd Travis configuration and .gitignore files.\nAdd type parameter to .horde.yml files.\nUpdate composer information.\nUpdated composer definitions.\nRename horde.yml files.\nStandardize library full names.\nGenerate horde.yml files for all components.\nHappy New Year!\nUse HTTPS.\nNow that all tests pass on PHP 7, bump supported PHP version at least for all packages that have tests.\nHappy New Year!\nMake this at least not fail on PHP 7.1\nCS: Standarize on full php open tag (fix <?=)\nCS: Remove parenthesis around include / require\nBFN\nphpdoc\nUse Horde_String's locale-independent methods.\nThose are incomplete.\nHappy New Year!\nRequire Horde_Test 2.4 instead.\nRevert \"This class is not PHPUnit 4 compatible\"\nThis class is not PHPUnit 4 compatible\nExclude BC breaking PHP versions.\nHorde::logMessage -> Horde::log\nHappy New Year!\n[kgr] Remove unnecessary lines of code\nMore on @php_bin@ uniformisation\nAdd composer.json to packages/libraries\nMerge branch 'master' into imp_6_1\nWTH?\nMerge branch 'master' into imp_6_1\nPHPUnit_Story is needed.\nMerge branch 'master' into imp_6_1\nHappy New Year!\nAdd/update Horde_Test dependencies.\nSetup tests without requiring any modification of Horde_Test glue files.\nStable versions.\nBump minimum versions to beta1.\nClean up the rest of the dependencies for Horde 5\nUpdate dep versions for Editor, Elastic_Search, Exception\nUpdate dep versions for Horde_Core\nUpdate dep versions for Horde_Argv\nExclude pre-releases of higher major versions too.\nFix log levels.\nFix TODO location.\nMerge branch 'master' into develop\nUse __DIR__.\nMake tests locale independent.\nFix autoloading.\nRemove Horde_Util::getTempDir().\nHappy New Year!\nStandardize copyright lines.\nFix PEAR install errors\nOnly manipulate the \"argv\" value.\nEnsure we always have a program name in argv.\nFix PRODUCTID.\nUpdate file listings.\nMoving COPYING file, copyright related edits\nWe still want to use the configured handler, even if setting the ident fails (Request #9322).\nMake every log handler, handle the message ident on their own\nTypo in package name (Horde_Horde_iCalendar -> Horde_iCalendar)\nStreamline changelogs, update developers.\n<notes> must not be emtpy.\nBump versions, reset release notes.\nFix package names.\nSet minimum version numbers.\nFix package names.\nConsistently use the same minimum PHP and PEAR installer versions.\nPrefix PEAR package names with Horde_ to avoid file name collisions.\nHappy New Year!\nFix package name.\nAdd framework translations.\nUse Horde_Translation to provide translations for framework packages.\nAll data passed around in Horde internally should be UTF-8.\nRequire the server and client to required UTF-8. Remove setCharset(), setCharsetEnvironment(), getExternalCharset().\nDoesn't work with H4 yet.\nSetup -> Configuration\nNone of these files exist anymore, and throw packaging errors\nWorking Incoming test.\nMFB: Cleanup logging.\nRewrote the basic filter definition.\nExtract the command line parsing.\nStart switching to injected logging.\nReactivate testing and make the basic filter test work again.\nThe test setup needs to be removed later. Minor fixes to prevent failures.\nUse autoloading.\nAdd the exception definition for this package.\nRemoved deprecated &new\nOnly use language name for locales that don't require the country part.\nConvert Icalendar to H4.\nTicket #9124: Remove horde/Core dependency from horde/Nls.\nMFB:\nMFB:\ngetOb() -> getAuth()\nHorde_Auth binder usage\nMFB: kolab/issue4257 (Always accept policy doesnt set atendee status to accepted)\nMFB (kolab/issue3962 (Names of config variables for \"untrusted\" text missleading), kolab/issue3967 (UNTRUSTED vs. UNAUTHENTICATED, distinction considered harmful))\nMFB: kolab/issue3983 (Phpunit testsuite fails on OpenPKG Kolab 2.2.2)\nRefactor Horde_Secret.\nUse Horde_Log instead of PEAR's Log.\nMake test_framework run again.\nH4 will require at a minimum PHP 5.2\nRemove unneded require_once() calls and @since tags\nHappy New Year!\nRemove $Horde CVS Tag\nImport un-converted framework libs from CVS HEAD"
